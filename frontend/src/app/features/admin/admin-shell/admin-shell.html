<app-toast-container />
<app-changelog-modal />
<div class="admin-shell">

  <div class="shell-content">

    <header class="admin-topbar">
      @if (!enDashboard) {
      <button class="topbar-back" type="button" (click)="volverDashboard()"
              title="Volver al panel" aria-label="Volver al panel">
        <lucide-icon [img]="icons.ArrowLeft" [size]="15" [strokeWidth]="2" />
        <span>Módulos</span>
      </button>
      }
      <div class="topbar-brand">
        <span class="brand-name">Korvix</span>
        <span class="brand-sep">/</span>
        <span class="brand-page">{{ paginaActual }}</span>
      </div>

      @if (enDashboard) {
      <div class="topbar-search">
        <lucide-icon class="topbar-search-icon" [img]="icons.Search" [size]="15" [strokeWidth]="2" />
        <input
             type="text"
             class="topbar-search-input"
             placeholder="Buscar en el sistema..."
             aria-label="Buscar en el sistema"
             [value]="searchQuery"
             (input)="onSearchInput($any($event.target).value)" />
      </div>
      }

      <div class="topbar-right">
        <app-notification-bell></app-notification-bell>
        <div class="profile-wrap">
          @if (profileMenuOpen) {
          <div class="profile-overlay" (click)="closeProfileMenu()"></div>
          }
          <button class="profile-trigger" (click)="toggleProfileMenu()">
            <span class="profile-avatar topbar-avatar">
              @if (currentAdmin?.profilePhotoUrl) {
              <img
                   [src]="currentAdmin!.profilePhotoUrl"
                   [alt]="currentAdmin?.name"
                   class="profile-avatar-img" />
              } @else {
              {{ currentAdmin?.name?.charAt(0) }}
              }
            </span>
            <span class="topbar-user">{{ roleLabel }}</span>
            <lucide-icon class="topbar-chevron" [img]="icons.ChevronDown" [size]="14" [strokeWidth]="2" />
          </button>
          @if (profileMenuOpen) {
          <div class="profile-dropdown">
            <span class="profile-dropdown-name">{{ currentAdmin?.name }}</span>
            <span class="profile-dropdown-email">{{ currentAdmin?.email }}</span>
            <span class="profile-dropdown-divider"></span>
            <span class="profile-dropdown-label">Apariencia</span>
            <button class="profile-dropdown-opt"
                    [class.active]="themeService.currentMode === 'light'"
                    (click)="themeService.setMode('light')">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="5"/>
                <line x1="12" y1="1" x2="12" y2="3"/>
                <line x1="12" y1="21" x2="12" y2="23"/>
                <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/>
                <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
                <line x1="1" y1="12" x2="3" y2="12"/>
                <line x1="21" y1="12" x2="23" y2="12"/>
                <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/>
                <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
              </svg>
              Claro
            </button>
            <button class="profile-dropdown-opt"
                    [class.active]="themeService.currentMode === 'dark'"
                    (click)="themeService.setMode('dark')">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
              </svg>
              Oscuro
            </button>
            <button class="profile-dropdown-opt"
                    [class.active]="themeService.currentMode === 'system'"
                    (click)="themeService.setMode('system')">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round">
                <rect x="2" y="3" width="20" height="14" rx="2"/>
                <line x1="8" y1="21" x2="16" y2="21"/>
                <line x1="12" y1="17" x2="12" y2="21"/>
              </svg>
              Sistema
            </button>
            <span class="profile-dropdown-divider"></span>
            <button class="profile-dropdown-btn" (click)="logout()">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round">
                <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
                <polyline points="16 17 21 12 16 7"/>
                <line x1="21" y1="12" x2="9" y2="12"/>
              </svg>
              Cerrar sesión
            </button>
          </div>
          }
        </div>
      </div>
    </header>

    <div class="shell-outlet">
      <router-outlet/>
    </div>

  </div>
</div>
