<div class="login-wrapper">

  <app-toast-container />

  <!-- ── Panel izquierdo: imagen de marca (public/login-left.png).
       Si aun no existe el archivo queda el gris de respaldo. -->
  <div class="login-left" aria-hidden="true">
    <div class="left-visual"></div>
  </div>

  <!-- ── Panel derecho: autenticación ──────────────────────── -->
  <section class="login-right">
    <div class="login-card">

      <div class="card-header">
        <img class="card-logo" src="LOGO.png" alt="Korvix" />
        <h2>Bienvenido</h2>
        <p>Ingresa a tu cuenta para continuar</p>
      </div>

      <div class="form">

        <div class="field" [class.field-invalid]="emailTouched && !!emailError">
          <label for="email">Correo electrónico</label>
          <div class="input-wrap">
            <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
              stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
              <polyline points="22,6 12,13 2,6"/>
            </svg>
            <input
              id="email"
              type="email"
              [(ngModel)]="email"
              placeholder="usuario@correo.com"
              autocomplete="email"
              (blur)="emailTouched = true"
              (keyup.enter)="login()"
              [disabled]="loading"
            />
          </div>
          @if (emailTouched && emailError) {
          <small class="field-error">{{ emailError }}</small>
          }
        </div>

        <div class="field" [class.field-invalid]="passwordTouched && !!passwordError">
          <label for="password">Contraseña</label>
          <div class="input-wrap">
            <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
              stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
              <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
            </svg>
            <input
              id="password"
              [type]="showPassword ? 'text' : 'password'"
              [(ngModel)]="password"
              placeholder="••••••••"
              autocomplete="current-password"
              (keydown)="checkCapsLock($event)"
              (keyup)="checkCapsLock($event)"
              (blur)="passwordTouched = true; capsLockOn = false"
              (keyup.enter)="login()"
              [disabled]="loading"
            />
            <button
              type="button"
              class="toggle-btn"
              (click)="showPassword = !showPassword"
              [attr.aria-label]="showPassword ? 'Ocultar contraseña' : 'Mostrar contraseña'"
            >
              @if (showPassword) {
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round">
                <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/>
                <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/>
                <path d="M14.12 14.12a3 3 0 1 1-4.24-4.24"/>
                <line x1="1" y1="1" x2="23" y2="23"/>
              </svg>
              } @else {
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                <circle cx="12" cy="12" r="3"/>
              </svg>
              }
            </button>
          </div>
          @if (passwordTouched && passwordError) {
          <small class="field-error">{{ passwordError }}</small>
          }
          @if (capsLockOn) {
          <small class="caps-warn">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
              stroke-linecap="round" stroke-linejoin="round">
              <rect x="2" y="6" width="20" height="12" rx="2"/>
              <line x1="6" y1="10" x2="6" y2="10"/>
              <line x1="10" y1="10" x2="10" y2="10"/>
              <line x1="14" y1="10" x2="14" y2="10"/>
              <line x1="18" y1="10" x2="18" y2="10"/>
              <line x1="7" y1="14" x2="17" y2="14"/>
            </svg>
            Bloq Mayús activado
          </small>
          }
        </div>

        <!-- Opción visual del diseño (sin funcionalidad nueva). -->
        <div class="options-row">
          <label class="keep-session">
            <input type="checkbox" checked />
            <span>Mantener sesión iniciada</span>
          </label>
        </div>

        <button class="login-btn" type="button" (click)="login()" [disabled]="loading || !email.trim() || !password.trim()">
          @if (!loading) {
          <span>Ingresar</span>
          <svg class="btn-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor"
            stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
            <line x1="5" y1="12" x2="19" y2="12"/>
            <polyline points="12 5 19 12 12 19"/>
          </svg>
          } @else {
          <span class="spinner"></span>
          <span>Ingresando...</span>
          }
        </button>

      </div>

    </div>
  </section>

</div>
