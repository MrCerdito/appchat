# ─── Nginx del HOST ───────────────────────────────────────────────────
# Instalación: copiar a /etc/nginx/sites-available/chat
#   sudo cp deploy/nginx-host.conf /etc/nginx/sites-available/chat
#   sudo ln -s /etc/nginx/sites-available/chat /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
# ────────────────────────────────────────────────────────────────────────

server {
    listen 80;
    server_name _;

    client_max_body_size 100M;

    # ── Seguridad básica ─────────────────────────────────────────────
    server_tokens off;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # ── Proxy al frontend (Angular en puerto 8095) ─────────────────
    location /agora/ {
        proxy_pass http://127.0.0.1:8095;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket (Socket.IO)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Timeouts largos para WebSocket
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
}
