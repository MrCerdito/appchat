services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: chat-postgres
    restart: always
    env_file:
      - ./backend/.env
    environment:
      POSTGRES_DB: ${DB_NAME:-app}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASS:-postgres}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-app}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - chat-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: chat-backend
    restart: always
    env_file:
      - ./backend/.env
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER:-postgres}
      DB_PASS: ${DB_PASS:-postgres}
      DB_NAME: ${DB_NAME:-app}
      JWT_SECRET: ${JWT_SECRET:-}
      JWT_EXPIRES: ${JWT_EXPIRES:-8h}
      PORT: ${PORT:-3000}
      NODE_ENV: production
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      CSP_DIRECTIVES: ${CSP_DIRECTIVES:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      MAIL_FROM: ${MAIL_FROM:-}
      APP_URL: ${APP_URL:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      CHAT_ENCRYPTION_KEY: ${CHAT_ENCRYPTION_KEY:-}
    expose:
      - "3000"
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks:
      - chat-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: chat-frontend
    restart: always
    ports:
      - "${FRONTEND_PORT:-8095}:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - chat-net

networks:
  chat-net:
    driver: bridge

volumes:
  pgdata:
    driver: local
  uploads_data:
    driver: local
