# El proyecto se llama `appchat` (no `reportacasos`) para reutilizar la red
# `appchat_chat-net` y el volumen `appchat_pgdata` que ya existen en esta
# maquina. Sin esto, compose crea `reportacasos_chat-net` con el mismo subnet
# 172.28.0.0/16 y falla con "Pool overlaps with other one on this address space".
name: appchat

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  # ── PostgreSQL con pgvector ──────────────────────────────────────────
  postgres:
    image: pgvector/pgvector:pg16
    container_name: chat-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: app
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASS:-postgres}
      POSTGRES_INITDB_ARGS: --data-checksums
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d app"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging: *default-logging
    networks:
      - chat-net

  # ── Redis ──────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: chat-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "0.3"
          memory: 128M
    logging: *default-logging
    networks:
      - chat-net

  # ── Backend (NestJS) ─────────────────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: chat-backend
    restart: unless-stopped
    stop_grace_period: 15s
    ports:
      - "127.0.0.1:3001:3001"
    env_file:
      - ./backend/.env
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      REDIS_URL: redis://redis:6379
      TZ: America/Bogota
      NODE_ENV: production
      CORS_ORIGINS: ${CORS_ORIGINS:-https://innoovacloud.com,https://cloud.sian365.co,https://web.sian365.co,https://app.sian365.co,https://sian365.co,https://controlacademic.co,https://app.controlacademic.co,https://web.controlacademic.co,https://edu.controlacademic.co}
      APP_URL: ${APP_URL:-https://innoovacloud.com}
      WHATSAPP_PROXY_URL: ${WHATSAPP_PROXY_URL:-}
      # Reply URL del popup OAuth de Teams. Debe coincidir exacto con el
      # configurado en Entra (Authentication > Web > Redirect URIs).
      MICROSOFT_REDIRECT_URI: ${MICROSOFT_REDIRECT_URI:-https://innoovacloud.com/korvix/advisors-whatsapp/teams/oauth/callback}
      # shared = la videollamada la crea TEAMS_MEETINGS_ACCOUNT con token de
      # aplicacion. advisor = modo legado, la crea cada asesor.
      TEAMS_MEETING_ORGANIZER: ${TEAMS_MEETING_ORGANIZER:-shared}
      # group (default) | shared-mailbox | advisor
      TEAMS_MEETING_ORGANIZER_SCOPE: ${TEAMS_MEETING_ORGANIZER_SCOPE:-group}
      TEAMS_GROUP_NAME: ${TEAMS_GROUP_NAME:-Soporte}
      # Object ID del grupo M365 'Soporte' (Soporte5342@innovacloud.co), que es
      # la agenda real compartida. Fijarlo evita depender del nombre, porque hay
      # dos grupos que se llaman 'Soporte'.
      TEAMS_GROUP_ID: ${TEAMS_GROUP_ID:-9d625868-450a-4886-8c91-84b07e6db317}
      # Modulo calendario/: lee el calendario del grupo de arriba y refleja
      # todos los eventos. Reusa MICROSOFT_CLIENT_ID/SECRET y el token cacheado.
      CALENDARIO_GRUPO_ID: ${CALENDARIO_GRUPO_ID:-}
      CALENDARIO_GRUPO_NOMBRE: ${CALENDARIO_GRUPO_NOMBRE:-Soporte}
      CALENDARIO_CACHE_SEGUNDOS: ${CALENDARIO_CACHE_SEGUNDOS:-300}
      CALENDARIO_MAX_PAGINAS: ${CALENDARIO_MAX_PAGINAS:-60}
      CALENDARIO_MAX_DIAS: ${CALENDARIO_MAX_DIAS:-1825}
      # Módulo de Correos. Reusa MICROSOFT_CLIENT_ID/SECRET de arriba; requiere
      # el permiso Application Mail.Read en la app Korvix con admin consent.
      CORREOS_MAILBOX_UPN: ${CORREOS_MAILBOX_UPN:-soporte@innovacloud.co}
      CORREOS_CARPETA_PADRE: ${CORREOS_CARPETA_PADRE:-ASIGNADOS}
      CORREOS_SYNC_MINUTOS: ${CORREOS_SYNC_MINUTOS:-5}
      CORREOS_SYNC_ACTIVO: ${CORREOS_SYNC_ACTIVO:-true}
    volumes:
      - uploads_data:/app/uploads
      - wa_session_data:/app/.session
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1536M
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging: *default-logging
    networks:
      - chat-net

  # ── Frontend (Angular + Nginx) ───────────────────────────────────────
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: chat-frontend
    restart: unless-stopped
    environment:
      API_URL: /korvix
      WS_URL: ""
      API_KEY: ${API_KEY:-}
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-8095}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/korvix/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 128M
    logging: *default-logging
    networks:
      - chat-net

networks:
  chat-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16

volumes:
  pgdata:
    driver: local
  uploads_data:
    driver: local
  wa_session_data:
    driver: local
